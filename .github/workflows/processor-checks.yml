name: Processor checks
on:
  workflow_dispatch:
jobs:
  gis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements/dep-window.txt
      - run: python -B -m unittest discover -s tests
