name: Build dep-agc candidate

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GHCR after CPU smoke checks
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/digitalearthpacific/dep-agc

jobs:
  candidate:
    if: github.repository == 'digitalearthpacific/dep-agc'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log initial disk usage and record candidate
        id: candidate
        run: |
          set -euo pipefail
          df -h
          docker system df
          revision=$(git rev-parse HEAD)
          ref="$IMAGE:candidate-${revision}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3.11.1

      - name: Build and load for local smoke checks
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./containers/processor.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.candidate.outputs.ref }}
          build-args: |
            DOCKER_IMAGE=${{ steps.candidate.outputs.ref }}
            COMMIT=${{ steps.candidate.outputs.revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/digitalearthpacific/dep-agc
            org.opencontainers.image.revision=${{ steps.candidate.outputs.revision }}

      - name: CPU-only image smoke checks
        env:
          REF: ${{ steps.candidate.outputs.ref }}
        run: |
          set -euo pipefail
          flags=(--rm --network none --read-only --user 65534:65534
                 --tmpfs /tmp:rw,nosuid,size=268435456
                 -e CUDA_VISIBLE_DEVICES= -e NVIDIA_VISIBLE_DEVICES=void
                 -e MPLCONFIGDIR=/tmp/matplotlib)
          test "$(docker image inspect "$REF" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          docker run "${flags[@]}" "$REF" --help
          docker run "${flags[@]}" --entrypoint /opt/adapter-venv/bin/python "$REF" -B -c \
            'import os, numpy, rasterio, dep_tools, tasks.__main__; assert os.getuid() == 65534; print("Adapter imports OK", numpy.__version__, rasterio.__version__)'
          docker run "${flags[@]}" --entrypoint /opt/venv/bin/python "$REF" -B -c \
            'import torch, torchvision, lightning, carbon.__main__; assert not torch.cuda.is_available(); print("CPU imports OK", torch.__version__, torchvision.__version__, lightning.__version__)'

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the smoke-checked image
        if: inputs.publish
        id: publish
        env:
          REF: ${{ steps.candidate.outputs.ref }}
        run: |
          set -euo pipefail
          docker push "$REF"
          digest=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Log disk usage after completion or failure
        if: always()
        run: |
          df -h
          docker system df || true

      - name: Summarise
        if: always()
        env:
          STATUS: ${{ job.status }}
          REF: ${{ steps.candidate.outputs.ref }}
          REVISION: ${{ steps.candidate.outputs.revision }}
          PUBLISH: ${{ inputs.publish }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo "### dep-agc candidate"
            echo "- Status: $STATUS"
            echo "- Source revision: $REVISION"
            echo "- Candidate: $REF"
            echo "- Platform: linux/amd64"
            if [[ -n "$DIGEST" ]]; then
              echo "- Published digest: $IMAGE@$DIGEST"
            elif [[ "$PUBLISH" == false ]]; then
              echo "- Build-only run: nothing published."
            else
              echo "- No published digest recorded; inspect the publish step before retrying."
            fi
            echo "- CPU smoke checks do not confer scientific or DEP execution qualification."
          } >> "$GITHUB_STEP_SUMMARY"
