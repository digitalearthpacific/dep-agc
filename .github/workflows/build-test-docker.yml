name: Test and build AGC

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [created]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/digitalearthpacific/dep-agc
  TAG: ${{ github.event.release.tag_name || format('ci-{0}', github.sha) }}

jobs:
  check:
    name: Build image and run GIS checks
    # Fork releases run the checks without publishing.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'release' && github.repository != 'digitalearthpacific/dep-agc')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - &checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - &setup_buildx
        uses: docker/setup-buildx-action@v3.11.1
        with:
          driver: docker

      - &build
        name: Build image locally
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            DOCKER_IMAGE=${{ env.IMAGE }}:${{ env.TAG }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/digitalearthpacific/dep-agc
            org.opencontainers.image.revision=${{ github.sha }}

      - &checks
        name: Run smoke checks and GIS tests
        env:
          REF: ${{ env.IMAGE }}:${{ env.TAG }}
        run: |
          set -euo pipefail
          # Temporary storage is for library caches and fixtures in the read-only container.
          container=(--rm --read-only
                     --tmpfs /tmp:rw,nosuid,size=268435456
                     -e CUDA_VISIBLE_DEVICES= -e NVIDIA_VISIBLE_DEVICES=void
                     -e AWS_EC2_METADATA_DISABLED=true)
          offline=("${container[@]}" --network none)
          test "$(docker image inspect "$REF" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          docker run "${offline[@]}" "$REF" --help
          docker run "${offline[@]}" --entrypoint /opt/venv/bin/python "$REF" -m pip check
          docker run "${offline[@]}" --entrypoint /opt/venv/bin/python "$REF" -B -c \
            'import os, sys, src.run_task, src.task, src.utils; assert callable(src.utils.infer_height) and "torch" not in sys.modules; import torch, torchvision, lightning; assert os.getuid() == 65534 and not torch.cuda.is_available()'
          docker run "${container[@]}" --network bridge \
            --mount "type=bind,source=$PWD/tests,target=/opt/processor/tests,readonly" \
            --entrypoint /opt/venv/bin/python "$REF" -B -m unittest discover -s tests

  publish:
    name: Build, check and publish release image
    if: github.event_name == 'release' && github.repository == 'digitalearthpacific/dep-agc'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - *checkout
      - *setup_buildx
      - *build
      - *checks

      - name: Log in to GHCR
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the checked image
        run: |
          set -euo pipefail
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          if [[ "$TAG" != latest ]]; then
            docker push "$IMAGE:latest"
          fi
